<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH 宠物</title>
<style>
  :root { color-scheme: light dark; }
  html, body {
    width: 100%; height: 100%; margin: 0;
    background: transparent; overflow: hidden;
  }
  body {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
    cursor: default;
  }

  #stage {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }

  /* The shadow is drawn here rather than baked into the atlas: a sprite
     atlas has no notion of "how high above the floor am I". It sits just
     under the pet's feet, which land around 70% down the cell. */
  #shadow {
    position: absolute;
    left: 50%; bottom: 20%;
    width: 52%; height: 6%;
    transform: translateX(-50%);
    border-radius: 50%;
    background: rgba(11, 31, 58, .20);
    filter: blur(1.5px);
    transition: transform .18s ease, opacity .18s ease;
    pointer-events: none;
  }
  body[data-animation="jumping"] #shadow { transform: translateX(-50%) scale(.72); opacity: .55; }
  body[data-animation="waving"] #shadow { transform: translateX(-50%) scale(.92); }
  body[data-animation="failed"] #shadow { transform: translateX(-50%) scale(1.06); opacity: .28; }

  #pet {
    position: relative;
    width: 100%; height: 100%;
    display: block;
    cursor: pointer;
    touch-action: none;
    image-rendering: pixelated;
    filter: drop-shadow(0 8px 10px rgba(8, 22, 44, .22));
    transition: filter .14s ease;
  }
  #stage:hover #pet { filter: drop-shadow(0 10px 12px rgba(8, 22, 44, .28)); }

  #splash {
    position: absolute; inset: 0;
    z-index: 999;
    pointer-events: none; overflow: visible;
  }
  .drop {
    position: absolute;
    left: 50%; bottom: 20%;
    width: 7px; height: 10px;
    border-radius: 50% 50% 45% 45%;
    background: #8fd8ff;
    box-shadow: 0 0 6px rgba(143, 216, 255, .85);
    opacity: 0;
    animation: drop-fly 1.1s cubic-bezier(.2, .7, .3, 1) forwards;
  }
  .ripple {
    position: absolute; left: 50%; bottom: 16%;
    width: 72px; height: 14px;
    border: 2px solid #8fd8ff;
    border-radius: 50%;
    opacity: 0;
    transform: translateX(-50%) scale(.4);
    animation: ripple 1s ease-out forwards;
    box-shadow: 0 0 10px rgba(143, 216, 255, .35);
  }
  /* A second celebration style, for pets that are not made of water. */
  .spark {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 2px;
    background: #ffe9a8;
    box-shadow: 0 0 8px rgba(255, 233, 168, .9);
    opacity: 0;
    animation: spark-fly 1.1s cubic-bezier(.2, .7, .3, 1) forwards;
  }

  @keyframes drop-fly {
    0% { opacity: 0; transform: translate(0, 0) scale(.35); }
    15% { opacity: 1; transform: translate(calc(var(--dx) * .18), calc(var(--dy) * .18)) scale(1.15); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.3); }
  }
  @keyframes ripple {
    0% { opacity: .75; transform: translateX(-50%) scale(.4); }
    100% { opacity: 0; transform: translateX(-50%) scale(1.9); }
  }
  @keyframes spark-fly {
    0% { opacity: 0; transform: translate(0, 0) scale(.3) rotate(0deg); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.4) rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .drop, .ripple, .spark { animation-duration: .01ms; }
    #shadow { transition: none; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="shadow" aria-hidden="true"></div>
    <canvas id="pet" role="button" aria-label="DSH 宠物：点击回到 DSH" tabindex="0"></canvas>
  </div>
  <div id="splash" aria-hidden="true"></div>

<script>
  // The native helper injects the manifest before this page runs.
  const manifest = window.__DSH_PET_MANIFEST__ || null

  if (!manifest) {
    console.error('dsh-pet: no manifest was injected')
  } else {
    const canvas = document.getElementById('pet')
    canvas.setAttribute('aria-label', `${manifest.name || 'DSH 宠物'}：点击回到 DSH · 拖动可移动`)

    window.DSHSpritePet.mount(manifest, { canvas })

    // Splash particles belong to the shell, not to the pet, so every sprite
    // pet gets them for free.
    const splash = document.getElementById('splash')
    const timers = new Set()
    const later = (fn, ms) => {
      const id = setTimeout(() => { timers.delete(id); fn() }, ms)
      timers.add(id)
      return id
    }

    window.addEventListener('dsh-pet-splash', (event) => {
      const kind = event.detail && event.detail.kind === 'sparkle' ? 'sparkle' : 'water'
      for (let index = 0; index < 20; index += 1) {
        const particle = document.createElement('span')
        particle.className = kind === 'sparkle' ? 'spark' : 'drop'
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 2.2
        const distance = 16 + Math.random() * 44
        particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`)
        particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`)
        particle.style.left = `${50 + (Math.random() - 0.5) * 12}%`
        particle.style.animationDelay = `${Math.random() * 0.1}s`
        particle.style.animationDuration = `${(0.85 + Math.random() * 0.25).toFixed(2)}s`
        splash.appendChild(particle)
        later(() => particle.remove(), 1500)
      }
      if (kind === 'water') {
        for (let index = 0; index < 2; index += 1) {
          const ripple = document.createElement('span')
          ripple.className = 'ripple'
          ripple.style.animationDelay = `${index * 0.16}s`
          ripple.style.animationDuration = '1.05s'
          splash.appendChild(ripple)
          later(() => ripple.remove(), 1400)
        }
      }
    })
  }
</script>
</body>
</html>
